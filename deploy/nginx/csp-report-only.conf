# Initial rollout include. Browser violations appear in developer tools without
# blocking resources. Replace this include with csp-enforced.conf after smoke.
add_header Content-Security-Policy-Report-Only "default-src 'none'; base-uri 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: https://images.unsplash.com; manifest-src 'self'; media-src 'none'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; worker-src 'none'; upgrade-insecure-requests" always;
